<style>

@media(prefers-color-scheme:dark){:root[data-theme=auto]{color-scheme:dark;--bg:#17122b;--card:#231c3f;--fld:#1b1534;--tx:#f1eefb;--mut:#b2a8d6;--bd:#3a3060;--ac:#b9a6fb;--pr:#7c5fe8;--acs:#322858;--bad:#f2a09a;--warn:#3a3000;--warntx:#f5e3a1;--c1:#f27c9f;--c2:#f0c15a;--c3:#58d0a9;--c4:#9b85f5;--p0:#1f4d45;--p1:#5a2a44;--p2:#594a1c;--p3:#26407a;--p4:#5e3527;--p5:#41357a}}
*{box-sizing:border-box}

}

@media(hover:none){.hint{display:none}}

.m.rev{background:transparent;border:3px solid var(--pr)}

.card.io{padding:8px;min-height:0;justify-content:flex-start}
.dlgo{position:fixed;inset:0;z-index:100;background:rgba(20,12,45,.55);display:flex;align-items:center;justify-content:center;padding:20px}.dlg{background:var(--card);color:var(--tx);border-radius:var(--r);padding:22px;max-width:380px;width:100%}.dlg p{margin:0 0 16px}.dlg .row{justify-content:flex-end}

<body>
<nav id="nav" aria-label="Main"></nav>
<main id="app"></main>
<script>
(()=>{
'use strict';
const KEY='recall.v1',MIN=6e4,DAY=864e5;
let S={cards:[],limit:20,log:{},imgs:{},theme:'auto'},storeOK=true,view='home',sess=null,msg=null,imgScroll=false,br=null,cu=null,menu=null;try{imgScroll=localStorage.getItem('recall.imgscroll')==='1'}catch(e){}
const draft={folder:'',deck:'',paste:''};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d)=>Number.isFinite(v)?v:d;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmt=d=>d<1?Math.round(d*24)+'h':d<30?Math.round(d)+'d':d<365?Math.round(d/30)+'mo':(Math.round(d/36.5)/10)+'y';
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function clean(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.cards))return null;
  const cards=[];
  for(const c of o.cards){
    if(!c||typeof c.f!=='string'||typeof c.b!=='string')continue;
    const x={id:String(c.id||uid()),folder:String(c.folder||'General'),deck:String(c.deck||'Default'),f:c.f,b:c.b,ease:num(c.ease,2.5),ivl:num(c.ivl,0),reps:num(c.reps,0),lapses:num(c.lapses,0),due:num(c.due,0),isNew:c.isNew!==false,st:['learn','review','relearn'].includes(c.st)?c.st:undefined,step:num(c.step,0)};
    if(typeof c.img==='string'&&Array.isArray(c.boxes)){x.img=c.img;x.k=num(c.k,0);x.boxes=c.boxes.filter(m=>m&&[m.x,m.y,m.w,m.h].every(Number.isFinite)).map(m=>({x:m.x,y:m.y,w:m.w,h:m.h}))}
    cards.push(x);
  }
  const limit=Number.isFinite(o.limit)&&o.limit>=0?Math.floor(o.limit):20;
  const log={};
  if(o.log&&typeof o.log==='object')for(const k in o.log){const v=o.log[k];if(v&&typeof v==='object')log[k]={n:num(v.n,0),r:num(v.r,0)}}
  const imgs={};
  if(o.imgs&&typeof o.imgs==='object')for(const k in o.imgs)if(typeof o.imgs[k]==='string'&&o.imgs[k].startsWith('data:image/'))imgs[k]=o.imgs[k];
  return{cards:cards.filter(c=>!c.img||(imgs[c.img]&&c.boxes[c.k])),limit,log,imgs,theme:['light','dark'].includes(o.theme)?o.theme:'auto'};
}
const idb=(()=>{try{return window.indexedDB}catch(e){return null}})();
let db=null,saved=new Set(),tmr=null;
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function openDB(){
  return Promise.race([new Promise((res,rej)=>{
    if(!idb)return rej(new Error('no idb'));
    const r=idb.open('recall',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('state');r.result.createObjectStore('imgs')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  }),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),4000))]);
}
async function idbLoad(){
  const tx=db.transaction(['state','imgs'],'readonly'),im=tx.objectStore('imgs');
  const main=await req(tx.objectStore('state').get('main'));
  if(!main)return null;
  const keys=await req(im.getAllKeys()),vals=await req(im.getAll()),imgs={};
  keys.forEach((k,i)=>imgs[k]=vals[i]);
  return clean(Object.assign({},main,{imgs}));
}
function lsSave(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true}catch(e){storeOK=false}return storeOK}
function setOK(v){if(storeOK!==v){storeOK=v;render()}}
function flush(){
  clearTimeout(tmr);tmr=null;
  if(!db)return Promise.resolve(lsSave());
  const snap={cards:S.cards,limit:S.limit,log:S.log,theme:S.theme},imgs=S.imgs;
  const add=Object.keys(imgs).filter(k=>!saved.has(k)).map(k=>[k,imgs[k]]);
  const del=[...saved].filter(k=>!(k in imgs));
  return new Promise(res=>{
    try{
      const tx=db.transaction(['state','imgs'],'readwrite'),im=tx.objectStore('imgs');
      tx.objectStore('state').put(snap,'main');
      add.forEach(a=>im.put(a[1],a[0]));del.forEach(k=>im.delete(k));
      tx.oncomplete=()=>{add.forEach(a=>saved.add(a[0]));del.forEach(k=>saved.delete(k));setOK(true);res(true)};
      tx.onerror=tx.onabort=()=>{setOK(false);res(false)};
    }catch(e){setOK(false);res(false)}
  });
}
function save(){if(!db){lsSave();return}clearTimeout(tmr);tmr=setTimeout(flush,200)}
addEventListener('pagehide',()=>{if(tmr)flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&tmr)flush()});

let est=null;
function refreshEst(){
  if(!(navigator.storage&&navigator.storage.estimate))return;
  navigator.storage.estimate().then(e=>{est=e;const t=document.getElementById('stor'),b=document.getElementById('storbar');if(t)t.textContent=storTxt();if(b)b.style.width=storPct()+'%'}).catch(()=>{});
}
const mb=v=>v>=1073741824?(v/1073741824).toFixed(1)+' GB':Math.max(0.1,v/1048576).toFixed(1)+' MB';
function storTxt(){
  if(!db)return 'Using browser storage with a limit of roughly 5 MB. Back up often.';
  if(est&&est.usage!=null&&est.quota)return 'Using about '+mb(est.usage)+' of roughly '+mb(est.quota)+' available on this device.';
  return 'Your cards are saved in this browser\'s database, which has far more room than before.';
}
const storPct=()=>est&&est.usage!=null&&est.quota?Math.min(100,Math.max(1,100*est.usage/est.quota)):1;

async function load(){
  try{db=await openDB()}catch(e){db=null}
  if(db){
    try{
      const s=await idbLoad();
      if(s)S=s;
      else{
        let old=null;
        try{const r=localStorage.getItem(KEY);if(r)old=clean(JSON.parse(r))}catch(e){}
        if(old){S=old;if(await flush())try{localStorage.removeItem(KEY)}catch(e){}}
      }
      saved=new Set(Object.keys(S.imgs));
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
      refreshEst();
      return;
    }catch(e){db=null}
  }
  try{
    const r=localStorage.getItem(KEY);
    if(r){const s=clean(JSON.parse(r));if(s)S=s}
  }catch(e){if(!(e instanceof SyntaxError))storeOK=false}
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t')}catch(e){storeOK=false}
}

const dayLog=()=>S.log[today()]||{n:0,r:0};
const remNew=()=>Math.max(0,S.limit-dayLog().n);
function decks(){
  const m={},now=Date.now();
  for(const c of S.cards){
    const k=c.folder+'|'+c.deck,d=m[k]||(m[k]={folder:c.folder,name:c.deck,nw:0,due:0,total:0});
    d.total++;
    if(c.isNew)d.nw++;else if(isDue(c,now))d.due++;
  }
  return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name));
}

const STEPS=[1,10],RSTEPS=[10],GRAD=1,EASYI=4,HARDF=1.2,EBONUS=1.3,LAHEAD=20*MIN;
const stOf=c=>c.isNew?'new':(c.st||(c.ivl>=1?'review':'learn'));
const cons=(v,prev)=>Math.max(1,Math.round(v),prev+1);
function fuzz(i){
  if(i<2)return i;
  if(i===2)return 2+Math.floor(Math.random()*2);
  const f=Math.max(1,Math.round(i*(i<7?.25:i<30?.15:.05)));
  return Math.max(2,Math.round(i)-f+Math.floor(Math.random()*(2*f+1)));
}
const isDue=(c,now)=>c.due<=now+(stOf(c)==='review'?0:LAHEAD);
// Anki (SM-2 style) scheduler. fz=true adds random fuzz when really grading.
function sched(c,g,fz){
  const now=Date.now(),st=stOf(c);
  let e=c.ease,i=c.ivl,l=c.lapses,s=c.step||0,ns,wait;
  if(st==='review'){
    const I=Math.max(1,Math.round(c.ivl)),late=Math.max(0,Math.floor((now-c.due)/DAY));
    if(g===1){l++;e=Math.max(1.3,e-.2);i=1;ns='relearn';s=0;wait=RSTEPS[0]*MIN}
    else{
      const h=cons((I+Math.floor(late/4))*HARDF,I),gd=cons((I+Math.floor(late/2))*e,h),ez=cons((I+late)*e*EBONUS,gd);
      if(g===2){e=Math.max(1.3,e-.15);i=h}else if(g===3)i=gd;else{i=ez;e+=.15}
      if(fz)i=fuzz(i);
      ns='review';wait=i*DAY;
    }
  }else{
    const steps=st==='relearn'?RSTEPS:STEPS;
    s=Math.min(s,steps.length-1);ns=st==='new'?'learn':st;
    const grad=iv=>{i=iv;ns='review';wait=iv*DAY};
    if(g===1){s=0;wait=steps[0]*MIN}
    else if(g===2){
      const m=steps.length===1?steps[0]*1.5:s===0?(steps[0]+steps[1])/2:steps[s];
      wait=Math.round(m)*MIN;
    }
    else if(g===3){
      if(s+1<steps.length){s++;wait=steps[s]*MIN}
      else grad(st==='relearn'?Math.max(1,c.ivl):GRAD);
    }
    else grad(st==='relearn'?Math.max(1,c.ivl)+1:EASYI);
  }
  return{ease:+e.toFixed(2),ivl:i,reps:c.reps+(g>1?1:0),lapses:l,due:now+wait,isNew:false,st:ns,step:s,wait};
}

function parse(t){
  t=t.replace(/^\uFEFF/,'');
  let q=0,tb=0,sc=0,cm=0;
  for(const ch of t){
    if(ch==='"')q^=1;
    else if(!q){if(ch==='\n')break;if(ch==='\t')tb++;else if(ch===';')sc++;else if(ch===',')cm++}
  }
  const sep=tb?'\t':sc>cm?';':',';
  const rows=[];let row=[],f='',inq=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(inq){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=ch}
    else if(ch==='"'&&f==='')inq=true;
    else if(ch===sep){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=ch;
  }
  row.push(f);rows.push(row);
  return rows.map(r=>[(r[0]||'').trim(),(r[1]||'').trim()]).filter(r=>r[0]&&r[1]);
}

function ask(text,ok){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='dlgo';
    o.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true"><p></p><div class="row"><button data-k="0">Cancel</button><button class="primary" data-k="1"></button></div></div>';
    o.querySelector('p').textContent=text;o.querySelector('[data-k="1"]').textContent=ok||'Delete';
    const done=v=>{document.removeEventListener('keydown',kd,true);o.remove();res(v)};
    const kd=e=>{if(e.key==='Escape'){e.preventDefault();done(false)}};
    o.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b)done(b.dataset.k==='1');else if(e.target===o)done(false)});
    document.addEventListener('keydown',kd,true);
    document.body.appendChild(o);o.querySelector('[data-k="0"]').focus();
  });
}

    const o=openF.has(f.name),fe=esc(f.name);
    return '<section class="panel"><div class="frow"><button class="fh" data-a="fold" data-f="'+fe+'" aria-expanded="'+o+'"><span class="ft b'+(i%6)+'">'+svg(ICON.folder)+'</span><span class="fn"><strong>'+fe+'</strong><span class="meta">'+plural(f.decks.length,'deck')+', '+plural(f.total,'card')+'</span></span><span class="chev'+(o?' open':'')+'">'+svg(ICON.chev)+'</span></button><button class="primary" data-a="study" data-f="'+fe+'">Study</button><div class="more"><button class="dots" data-a="menu" data-f="'+fe+'" aria-label="More actions for folder '+fe+'" aria-haspopup="menu" aria-expanded="'+(menu===f.name+'\u0001')+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>'+(menu===f.name+'\u0001'?'<div class="mnu" role="menu"><button role="menuitem" data-a="browse" data-f="'+fe+'">Cards</button><button role="menuitem" data-a="custom" data-f="'+fe+'">Custom study</button><button role="menuitem" class="danger" data-a="delf" data-f="'+fe+'">Delete folder</button></div>':'')+'</div></div>'+chips(Math.min(f.nw,rn),f.due)+
    (o?'<div class="dl">'+f.decks.map(d=>'<div class="dr"><div class="n"><strong>'+esc(d.name)+'</strong>'+chips(Math.min(d.nw,rn),d.due)+'</div><div class="row"><button data-a="study" data-f="'+fe+'" data-d="'+esc(d.name)+'">Study</button><div class="more"><button class="dots" data-a="menu" data-f="'+fe+'" data-d="'+esc(d.name)+'" aria-label="More actions for '+esc(d.name)+'" aria-haspopup="menu" aria-expanded="'+(menu===f.name+'\u0001'+d.name)+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>'+(menu===f.name+'\u0001'+d.name?'<div class="mnu" role="menu"><button role="menuitem" data-a="browse" data-f="'+fe+'" data-d="'+esc(d.name)+'">Cards</button><button role="menuitem" data-a="custom" data-f="'+fe+'" data-d="'+esc(d.name)+'">Custom study</button><button role="menuitem" class="danger" data-a="del" data-f="'+fe+'" data-d="'+esc(d.name)+'">Delete deck</button></div>':'')+'</div></div></div>').join('')+'</div>':'')+'</section>';
  }).join('');
  return head('Study',t.length?'Open a folder to see its decks.':'')+warnHTML()+statusHTML()+
  (t.length&&tot?'<div class="panel hero b5"><div><h2>All folders</h2><p class="meta" style="color:inherit">'+plural(tot,'card')+' ready</p></div><button class="primary" data-a="study">Study all</button></div>':'')+
  (rows||'<div class="panel"><h2>No folders yet</h2><p class="meta">Add cards to create your first folder and deck.</p><div class="row"><button class="primary" data-a="tab" data-v="add">Add cards</button></div></div>');
}

function addHTML(){
  return head('Add cards')+warnHTML()+statusHTML()+
  '<section class="panel"><h2>Where do the cards go?</h2><div class="two"><div><label class="f" for="folder">Folder</label><input type="text" id="folder" autocomplete="off" placeholder="General" list="fl" value="'+esc(draft.folder)+'"><datalist id="fl">'+flOpts()+'</datalist></div><div><label class="f" for="deck">Deck</label><input type="text" id="deck" autocomplete="off" placeholder="Default" value="'+esc(draft.deck)+'"></div></div></section>'+
  '<section class="panel"><h2>Import from text or a file</h2>'+
  '<label class="f" for="file">Upload a file (.csv, .tsv or .txt)</label><input type="file" id="file" accept=".csv,.tsv,.txt,text/*">'+
  '<label class="f" for="paste">Or paste cards here</label><textarea id="paste" placeholder="Front&#9;Back">'+esc(draft.paste)+'</textarea>'+
  '<div class="row"><button class="primary" data-a="import">Import cards</button></div></section>'+
  '<section class="panel"><h2>Image occlusion</h2>'+
  '<label class="f" for="iofile">Choose an image</label><input type="file" id="iofile" accept="image/*"></section>';
}

function settingsHTML(){
    const th=(v,n)=>'<button data-a="th" data-t="'+v+'" aria-pressed="'+(S.theme===v)+'">'+n+'</button>';
  return head('Settings')+warnHTML()+statusHTML()+
  '<section class="panel"><h2>Appearance</h2><p class="meta">Auto follows your device. Night mode uses a dark background that is easier on the eyes.</p><div class="row">'+th('auto','Auto')+th('light','Day')+th('dark','Night')+'</div></section>'+
  '<section class="panel"><h2>Daily limit</h2><p class="meta">The most new cards you study each day, across all decks.</p><label class="f" for="limit">New cards per day</label><input type="number" id="limit" min="0" max="9999" inputmode="numeric" value="'+S.limit+'"></section>'+
  '<section class="panel"><h2>Your data</h2><p class="meta">Your cards and progress live in this browser only. To move to another device, download a backup here and restore it there. Clearing your browser data erases everything, so back up often.</p>'+
  '<div class="seg" role="img" aria-label="Storage used"><i id="storbar" style="width:'+(db?storPct():Math.min(100,JSON.stringify(S).length/51200))+'%;background:var(--pr)"></i></div><p class="meta" id="stor">'+storTxt()+'</p>'+
  '<div class="row"><button class="primary" data-a="backup">Download backup</button><input class="sr" type="file" id="restore" accept=".json,application/json"><label class="btn" for="restore">Restore backup</label></div></section>';
}

function studyHTML(){
  const q=sess.q,c=q.length&&S.cards.find(x=>x.id===q[0]);
  const exit='<button class="ghost" data-a="tab" data-v="decks">Exit</button>';
  if(!c)return '<div class="rvp">'+warnHTML()+'<div class="top">'+exit+'</div><div class="card"><div class="f1">'+(sess.done?'Session complete. You reviewed '+plural(sess.done,'card')+'.':'Nothing is due right now. Come back later or raise your daily new-card limit.')+'</div></div><div class="acts"><button class="primary" data-a="tab" data-v="decks">Back to decks</button></div></div>';
  const pct=Math.round(100*sess.done/(sess.done+q.length));
  let acts;
  if(!sess.show)acts='<p class="meta hint2">Tap the card to show the answer'+(sess.cram?' · schedule unchanged':'')+'</p>';
  else if(sess.cram)acts='<div class="grades c2"><button class="g1" data-a="g" data-g="1"><span>Again</span><small>later</small></button><button class="g3" data-a="g" data-g="3"><span>Got it</span><small>done</small></button></div>';
  else acts='<div class="grades">'+['Again','Hard','Good','Easy'].map((n,i)=>{const g=i+1;return '<button class="g'+g+'" data-a="g" data-g="'+g+'"><span>'+n+'</span><small>'+lab(sched(c,g).wait)+'</small></button>'}).join('')+'</div>';
  return '<div class="rvp">'+warnHTML()+'<div class="top">'+exit+'<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><div style="width:'+pct+'%"></div></div><span class="meta">'+q.length+' left</span>'+(c.img?'<button class="ghost" data-a="imgfit">'+(imgScroll?'Fit screen':'Scroll')+'</button>':'')+'</div>'+
  (c.img?'<div class="card io'+(imgScroll?' sc':'')+'"'+(sess.show?'':' data-a="show"')+'><div class="stage"><img src="'+S.imgs[c.img]+'" alt="Image with hidden labels">'+c.boxes.map((b,i)=>'<div class="m'+(i===c.k?(sess.show?' rev':' t'):'')+'" style="'+pos(b)+'">'+(i===c.k&&!sess.show?'?':'')+'</div>').join('')+'</div></div><p class="meta">Recall the label under the highlighted cover.</p>':'<div class="card"'+(sess.show?'':' data-a="show"')+'><div class="f1">'+esc(c.f)+'</div>'+(sess.show?'<div class="ans">'+esc(c.b)+'</div>':'')+'</div>')+
  '<div class="acts">'+acts+'<p class="meta hint">Space, Enter or a click on the card shows the answer. Keys 1 to 4 grade it: Again, Hard, Good, Easy.</p></div></div>';
}

function render(){
  const st=view==='study',nav=$('#nav');
  document.documentElement.dataset.theme=S.theme;
  document.body.classList.toggle('rv',st);
  nav.hidden=st;nav.innerHTML=st?'':navHTML();
  $('#app').innerHTML=st?studyHTML():view==='io'?ioHTML():view==='browse'?browseHTML():view==='custom'?customHTML():view==='decks'?decksHTML():view==='add'?addHTML():view==='settings'?settingsHTML():homeHTML();
  if(view==='settings')refreshEst();
}

const app=$('#app');
addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){menu=null;render()}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;msg=null;render();scrollTo(0,0)}});
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(!b){if(menu){menu=null;render()}return}
  const a=b.dataset.a,d=b.dataset.d,f=b.dataset.f;
  if(a==='menu'){const k=f+'\u0001'+(d||'');menu=menu===k?null:k;render();return}
  if(menu){menu=null;render()}
  if(a==='study')start(f,d);
  else if(a==='del'){
    const n=S.cards.filter(c=>c.folder===f&&c.deck===d).length;
    if(await ask('Delete deck "'+d+'" and its '+plural(n,'card')+'? This cannot be undone.')){S.cards=S.cards.filter(c=>!(c.folder===f&&c.deck===d));prune();save();say('Deleted deck "'+d+'".')}
  }
  else if(a==='delf'){
    const n=S.cards.filter(c=>c.folder===f).length;
    if(await ask('Delete folder "'+f+'" with all its decks and '+plural(n,'card')+'? This cannot be undone.')){S.cards=S.cards.filter(c=>c.folder!==f);prune();save();say('Deleted folder "'+f+'".')}
  }
  else if(a==='browse'){br={f,d,q:''};view='browse';msg=null;render();scrollTo(0,0)}
  else if(a==='custom'){cu={f,d,mode:'ahead',n:{ahead:1,new:10,cram:50}};view='custom';msg=null;render();scrollTo(0,0)}
  else if(a==='cmode'){cu.mode=b.dataset.m;render()}
  else if(a==='cgo'){const ids=cuIds();if(ids.length)startList(ids,cu.mode==='cram')}
  else if(a==='delc'){
    if(await ask('Delete this card? This cannot be undone.')){S.cards=S.cards.filter(c=>c.id!==b.dataset.id);prune();save();render()}
  }
  else if(a==='fold'){if(openF.has(f))openF.delete(f);else openF.add(f);render()}
  else if(a==='theme'){S.theme=isDark()?'light':'dark';save();render()}
  else if(a==='th'){S.theme=b.dataset.t;save();render()}
  else if(a==='tab'){view=b.dataset.v;msg=null;render();scrollTo(0,0)}
  else if(a==='show'){sess.show=true;render()}
  else if(a==='imgfit'){imgScroll=!imgScroll;try{localStorage.setItem('recall.imgscroll',imgScroll?'1':'0')}catch(e){}render()}
  else if(a==='g')grade(+b.dataset.g);
  else if(a==='import')doImport();
  else if(a==='backup')backup();
  else if(a==='iomake')makeIO();
  else if(a==='ioundo'){io.boxes.pop();render()}
  else if(a==='iocancel'){io=null;view='add';render()}
});
app.addEventListener('pointerdown',e=>{
  const st=e.target.closest('#stage');
  if(!st||view!=='io')return;
  e.preventDefault();st.setPointerCapture(e.pointerId);
  const r=st.getBoundingClientRect(),el=document.createElement('div');
  el.className='m ed';st.appendChild(el);
  drag={r,el,x:cl((e.clientX-r.left)/r.width),y:cl((e.clientY-r.top)/r.height)};
});
const rect=e=>{const x=cl((e.clientX-drag.r.left)/drag.r.width),y=cl((e.clientY-drag.r.top)/drag.r.height);return{x:Math.min(drag.x,x),y:Math.min(drag.y,y),w:Math.abs(x-drag.x),h:Math.abs(y-drag.y)}};
app.addEventListener('pointermove',e=>{if(drag)drag.el.style.cssText=pos(rect(e))});
app.addEventListener('pointerup',e=>{if(!drag)return;const b=rect(e);drag=null;if(b.w>.01&&b.h>.01)io.boxes.push(b);render()});
app.addEventListener('pointercancel',()=>{drag=null;render()});
app.addEventListener('input',e=>{
  if(e.target.id==='brq'&&br){br.q=e.target.value;$('#brlist').innerHTML=brList()}
  else if(e.target.id==='cun'&&cu){cu.n[cu.mode]=e.target.value;$('#cusum').innerHTML=cuSum()}
  else if(e.target.id==='deck')draft.deck=e.target.value;
  else if(e.target.id==='paste')draft.paste=e.target.value;
  else if(e.target.id==='iodeck'&&io)io.deck=e.target.value;
  else if(e.target.id==='iofolder'&&io)io.folder=e.target.value;
  else if(e.target.id==='folder')draft.folder=e.target.value;
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='limit'){const v=parseInt(t.value,10);if(v>=0){S.limit=v;save();render()}}
  else if(t.id==='restore'&&t.files[0])restore(t.files[0]);
  else if(t.id==='iofile'&&t.files[0])openIO(t.files[0]);
});
addEventListener('keydown',e=>{
  if(view!=='study'||!sess.q.length||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,tag=t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(!sess.show){
    if(e.key===' '||e.key==='Enter'){
      if(t.closest&&t.closest('button')&&t.dataset.a!=='show')return;
      e.preventDefault();sess.show=true;render();
    }
  }else if(e.key.length===1&&'1234'.includes(e.key))grade(+e.key);
});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
load().catch(()=>{}).then(render);
})();
</script>
</body>
</html>
